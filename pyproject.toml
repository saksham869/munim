[project]
name = "munim"
version = "0.1.0"
description = "Spending limits and a scorecard for AI growth agents that act on a merchant's money."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100"]

[tool.setuptools]
packages = ["munim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
